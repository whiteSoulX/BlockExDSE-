<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>BlockExDSE Trading Terminal</title>
<style>
:root{--bg:#0e1420;--card:#161e2e;--line:#26324a;--txt:#e6ecf8;--mut:#8b9bb8;--ok:#2fbf71;--warn:#f0b43c;--bad:#ec5b5b;--acc:#4f8cff;--in:#0b101a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:700;font-size:16px}.brand small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--acc);color:var(--acc)}
nav{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap;min-height:40px}
nav button.on{background:var(--card);color:var(--txt);border:1px solid var(--line)}
nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--warn);color:#111;font-size:11px;font-weight:700}
main{max-width:1150px;margin:0 auto;padding:14px 16px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
h2{font-size:12px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
h3{margin:0 0 6px;font-size:17px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;background:var(--in);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit;min-height:44px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--acc);min-height:44px;width:100%}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}.btn.sm{width:auto;padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--txt);font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.seg button.buy.on{background:var(--ok);border-color:var(--ok)}.seg button.sell.on{background:var(--bad);border-color:var(--bad)}
.sub{color:var(--mut);font-size:12px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;background:var(--in);border:1px solid var(--line)}
.s-settled,.s-matched,.s-active{color:var(--ok);border-color:var(--ok)}.s-rejected{color:var(--bad);border-color:var(--bad)}.s-open,.s-partial,.s-approval_pending,.s-held{color:var(--warn);border-color:var(--warn)}
.pipe{display:flex;gap:5px;margin:10px 0;flex-wrap:wrap}.st{flex:1;min-width:74px;text-align:center;padding:8px 2px;border-radius:8px;background:var(--in);border:1px solid var(--line);font-size:11px;color:var(--mut)}
.st.done{background:rgba(47,191,113,.15);border-color:var(--ok);color:var(--ok)}.st.fail{background:rgba(236,91,91,.15);border-color:var(--bad);color:var(--bad)}.st.hold{background:rgba(240,180,60,.15);border-color:var(--warn);color:var(--warn)}
.ocard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--in)}
.ocard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.buy-t{color:var(--ok);font-weight:700}.sell-t{color:var(--bad);font-weight:700}
.hash{cursor:pointer;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500}.scroll{overflow-x:auto}
.node{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--bad)}.dot.up{background:var(--ok)}.dot.f{background:var(--warn)}
.note{background:var(--in);border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mut)}
.demo{background:rgba(240,180,60,.1);border-color:var(--warn);color:var(--txt)}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps div.on{background:var(--acc)}.steps div.ok{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--in);color:var(--txt);font-size:12px;cursor:pointer;min-height:34px}
.vchip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--in);color:var(--mut);font-size:11px}.vchip.y{border-color:var(--ok);color:var(--ok)}.vchip.n{border-color:var(--bad);color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.col h3{font-size:14px}.item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#222c42;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;display:none;max-width:90%}
#tour{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#tour .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:440px;width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.mkbar{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.mkbar button{background:var(--in);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.mkbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}.mkbar .sub{flex:1;min-width:200px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;gap:8px}
.trow.on{background:var(--in);outline:1px solid var(--acc)}.up{color:var(--ok)}.dn{color:var(--bad)}
.lad{display:grid;grid-template-columns:1fr 1fr;font-size:13px}.lad div{padding:4px 8px;position:relative}.lad .h{color:var(--mut);font-size:11px}
.lad .a{color:var(--bad)}.lad .b{color:var(--ok)}.lad .r{text-align:right}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:5px}.live.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tag{padding:1px 7px;border-radius:6px;font-size:10px;background:var(--in);border:1px solid var(--line);color:var(--mut);margin-left:4px}
.keybox{word-break:break-all;font-size:12px;margin-top:8px}
@media(max-width:700px){
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:flex-start;gap:2px}
  nav button{padding:6px 8px;font-size:12px;min-width:56px;border:0!important}
  .row{grid-template-columns:1fr 1fr}.who .nm{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">BlockExDSE<small>Edge-validated settlement prototype v2.0 (simulated)</small></div>
  <div class="who" id="who"></div>
</header>
<div class="mkbar" id="mkbar" style="display:none"></div>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>
<div id="tour"></div>

<script src="/vendor/sign.js"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString();
const short = h => h ? h.slice(0, 10) + "…" + h.slice(-6) : "–";
const S = { token: sessionStorage.getItem("bx_token") || "", market: sessionStorage.getItem("bx_mk") || "DSE", me: null, portfolios: null, info: null,
            view: null, tab: "in", otpDemo: "", orders: [], cur: null, side: "BUY", otype: "LIMIT", tk: {}, snap: {}, nodes: [], req: null,
            accounts: [], demo: [], sim: {}, es: null, liveAt: 0, key: null, keyDemo: false, tmpKey: null, review: [],
            lab: { audit: {}, results: null, tamper: {}, bench: null, benchJob: null, busy: false } };
const STAGES = ["submitted", "edge_validated", "consensus", "onchain", "matched", "settled"];
const LABEL = { submitted: "Signed by investor", edge_validated: "Edge checked", consensus: "Validators signed", onchain: "Verified on-chain", matched: "Matched", settled: "Settled" };
const TABS = {
  trader: [["trade", "Trade"], ["orders", "Orders"], ["portfolio", "Portfolio"], ["market", "Market"], ["proof", "Proof"], ["roadmap", "Roadmap"]],
  broker: [["requests", "Requests"], ["review", "Review"], ["orders", "Orders"], ["accounts", "Accounts"], ["market", "Market"], ["proof", "Proof"], ["roadmap", "Roadmap"]],
  admin:  [["requests", "Requests"], ["review", "Review"], ["orders", "Orders"], ["accounts", "Accounts"], ["market", "Market"], ["proof", "Proof"], ["roadmap", "Roadmap"]],
};
const MODE_NAME = { chain_only: "Contract only (no edge)", edge_only: "Gateway check only", fixed3: "Always 3 of 4", fixed4: "Always 4 of 4", racd: "Risk-proportional (3 or 4)" };

/* ───────── helpers ───────── */
const MK = () => S.info.markets[S.market];
function money(m, n) { const f = S.info.markets[m].fmt; return f.prefix + (n / f.div).toLocaleString(undefined, { minimumFractionDigits: f.dec, maximumFractionDigits: f.dec }) + f.suffix; }
function px(m, n) { return fmt(n) + S.info.markets[m].fmt.price_suffix; }
async function api(path, opt = {}) {
  const headers = { "Content-Type": "application/json" };
  if (S.token) headers.Authorization = "Bearer " + S.token;
  const r = await fetch(path, { ...opt, headers, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    if (r.status === 401 && S.token && !path.includes("/auth/login")) { signOutLocal(); toast("Session ended. Please sign in again."); }
    const d = j.detail; throw new Error(typeof d === "string" ? d : (Array.isArray(d) ? "Please check the form fields." : r.statusText));
  }
  return j;
}
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 4200); }
function signOutLocal() {
  S.token = ""; S.tab = "in"; S.otpDemo = ""; S.me = null; S.portfolios = null; S.view = null; S.cur = null; S.key = null; S.keyDemo = false; S.review = [];
  sessionStorage.removeItem("bx_token"); sessionStorage.removeItem("bx_demo_key"); route();
}
function setToken(t) { S.token = t; sessionStorage.setItem("bx_token", t); }
document.addEventListener("click", e => { const h = e.target.closest(".hash"); if (h && h.dataset.full && navigator.clipboard) navigator.clipboard.writeText(h.dataset.full).then(() => toast("Copied: " + short(h.dataset.full))); });
const H = h => h ? `<span class="hash mono" data-full="${esc(h)}" title="Click to copy">${esc(short(h))}</span>` : "–";
function busy(btn, on) { if (btn) btn.disabled = on; }
function chgHTML(c) { return `<span class="${c > 0 ? "up" : c < 0 ? "dn" : "sub"}">${c > 0 ? "+" : ""}${c.toFixed(2)}%</span>`; }

/* ───────── the investor's signing key (stays on this device) ───────── */
const keyStore = {
  get(email) { try { return localStorage.getItem("bx_key_" + String(email).toLowerCase()); } catch (e) { return null; } },
  set(email, k) { try { localStorage.setItem("bx_key_" + String(email).toLowerCase(), k); return true; } catch (e) { return false; } },
};
function loadKey() {
  const u = S.me && S.me.user; S.key = null; S.keyDemo = false;
  if (!u || u.role !== "trader" || !window.BXSign) return;
  const demo = sessionStorage.getItem("bx_demo_key"), k = demo || keyStore.get(u.email) || S.tmpKey;
  if (!k || !BXSign.validKey(k)) return;
  if (u.wallet && BXSign.addressOf(k).toLowerCase() !== u.wallet.toLowerCase()) return;      // a key that belongs to another account
  S.key = k; S.keyDemo = !!demo;
}
function ensureKey() {                      // called at the identity step: create the key here, in the browser
  const em = S.me.user.email; let k = keyStore.get(em) || S.tmpKey;
  if (!k || !BXSign.validKey(k)) { k = BXSign.newKey(); S.tmpKey = k; if (!keyStore.set(em, k)) toast("This browser blocks local storage: the key will be lost when the tab closes."); }
  return k;
}
function domainOf(m) {                      // computed here from the chain id and contract address, then compared with the gateway's value
  const cfg = S.info.markets[m], d = BXSign.domainSeparator(S.info.chain.id, cfg.contract);
  if (d.toLowerCase() !== String(cfg.domain).toLowerCase()) throw new Error("Safety check failed: the signing domain does not match this contract.");
  return d;
}

/* ───────── routing ───────── */
function route() {
  const u = S.me && S.me.user;
  renderWho();
  $("#mkbar").style.display = "none";
  if (!u) { S.view = "guest"; $("#nav").innerHTML = ""; return mountGuest(); }
  if (u.role === "trader" && u.status !== "active") { S.view = "onboard"; $("#nav").innerHTML = ""; return mountOnboard(); }
  const tabs = TABS[u.role]; if (!tabs.some(t => t[0] === S.view)) S.view = tabs[0][0];
  renderNav();
  renderMarketBar();
  ({ trade: mountTrade, orders: mountOrders, portfolio: mountPortfolio, market: mountMarket, roadmap: mountRoadmap, requests: mountRequests,
     accounts: mountAccounts, review: mountReview, proof: mountProof })[S.view]();
  connectStream(); tick();
}
function renderNav() {
  const u = S.me.user, tabs = TABS[u.role];
  $("#nav").innerHTML = tabs.map(t => `<button data-v="${t[0]}" class="${S.view === t[0] ? "on" : ""}">${t[1]}${t[0] === "review" && S.review.length ? `<span class="cnt">${S.review.length}</span>` : ""}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { S.view = b.dataset.v; route(); });
}
function renderMarketBar() {
  const bar = $("#mkbar"); bar.style.display = "flex";
  bar.innerHTML = Object.values(S.info.markets).map(m => `<button data-m="${m.code}" class="${m.code === S.market ? "on" : ""}">${esc(m.code)} · ${esc(m.name)}</button>`).join("") +
    `<span class="sub" id="mkinfo">${esc(MK().hours)}. Simulation: orders are accepted at any time.</span>`;
  bar.querySelectorAll("button").forEach(b => b.onclick = () => { S.market = b.dataset.m; sessionStorage.setItem("bx_mk", S.market); S.cur = null; route(); });
}
function renderWho() {
  const u = S.me && S.me.user;
  $("#who").innerHTML = (u ? `<span class="nm">${esc(u.name)}</span><span class="badge">${esc(u.role)}</span><button class="btn ghost sm" id="bOut">Sign out</button>` : "") + `<button class="btn ghost sm" id="bTour">Tour</button>`;
  $("#bTour").onclick = () => openTour(0);
  if (u) $("#bOut").onclick = async () => { try { await api("/api/auth/logout", { method: "POST" }); } catch (e) {} signOutLocal(); };
}

/* ───────── guest: sign in / sign up ───────── */
async function mountGuest() {
  $("#main").innerHTML = `<div class="grid"><div class="card" style="max-width:480px;margin:0 auto;width:100%;grid-column:1/-1">
    <div class="seg" style="margin-bottom:12px"><button id="tIn" class="${S.tab === "in" ? "on buy" : ""}">Sign in</button><button id="tUp" class="${S.tab === "up" ? "on buy" : ""}">Create account</button></div>
    <div id="gform"></div></div></div>`;
  $("#tIn").onclick = () => { S.tab = "in"; mountGuest(); }; $("#tUp").onclick = () => { S.tab = "up"; mountGuest(); };
  S.tab === "in" ? formSignIn() : formSignUp();
}
async function formSignIn() {
  $("#gform").innerHTML = `<label>Email</label><input id="em" type="email" autocomplete="username" placeholder="you@example.com">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div id="err" class="sub" style="color:var(--bad);margin-top:6px;min-height:18px"></div>
    <button class="btn" id="go" style="margin-top:6px">Sign in</button>
    <div class="note" style="margin-top:14px"><b>Demo accounts</b> (this is a simulation; tap one to sign in)<div class="chips" id="chips"></div></div>`;
  $("#go").onclick = () => doLogin($("#em").value, $("#pw").value, $("#go"));
  $("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
  try { S.demo = await api("/api/demo-accounts"); } catch (e) {}
  if (!$("#chips")) return;
  $("#chips").innerHTML = S.demo.map((d, i) => `<button class="chip" data-i="${i}">${esc(d.label)} · ${esc(d.role)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c => c.onclick = () => { const d = S.demo[+c.dataset.i]; doLogin(d.email, d.password, null); });
}
function keepDemoKey(r) { if (r.demo_key) sessionStorage.setItem("bx_demo_key", r.demo_key); else sessionStorage.removeItem("bx_demo_key"); }
async function doLogin(email, password, btn) {
  busy(btn, true);
  try { const r = await api("/api/auth/login", { method: "POST", body: { email, password } }); setToken(r.token); keepDemoKey(r); await loadMe(); route(); }
  catch (e) { const el = $("#err"); if (el) el.textContent = e.message; else toast(e.message); }
  busy(btn, false);
}
function formSignUp() {
  $("#gform").innerHTML = `<div class="note demo">Simulation only. Real accounts are opened through a licensed broker and a BO account; nothing here is real.</div>
    <label>Full name</label><input id="nm" autocomplete="name">
    <label>Email</label><input id="em" type="email" autocomplete="email">
    <label>Mobile (Bangladesh)</label><input id="mo" type="tel" placeholder="01712345678" autocomplete="tel">
    <label>Password (8+ characters, a letter and a number)</label><input id="pw" type="password" autocomplete="new-password">
    <div id="err" class="sub" style="color:var(--bad);margin-top:6px;min-height:18px"></div>
    <button class="btn" id="go">Create account</button>`;
  $("#go").onclick = async () => {
    busy($("#go"), true);
    try {
      const r = await api("/api/auth/signup", { method: "POST", body: { name: $("#nm").value, email: $("#em").value, mobile: $("#mo").value, password: $("#pw").value } });
      setToken(r.token); sessionStorage.removeItem("bx_demo_key"); S.otpDemo = r.otp_demo; await loadMe(); route();
    } catch (e) { $("#err").textContent = e.message; }
    busy($("#go"), false);
  };
}

/* ───────── onboarding wizard ───────── */
function mountOnboard() {
  const u = S.me.user, st = u.status;
  const idx = { otp_pending: 1, kyc_pending: 2, rejected: 2, approval_pending: 3 }[st] ?? 1;
  const bar = [0, 1, 2, 3].map(i => `<div class="${i < idx ? "ok" : i === idx ? "on" : ""}"></div>`).join("");
  let body = "", addr = "";
  if (st === "otp_pending") body = `<h3>Verify your mobile</h3><p class="sub">Step 2 of 4. Enter the 6-digit code.</p>
    ${S.otpDemo ? `<div class="note demo">Demo only: your code is <b class="mono" style="font-size:18px">${esc(S.otpDemo)}</b><br>A real system would send this by SMS.</div>` : `<div class="note">Tap “Send new code” to get a demo code.</div>`}
    <label>Code</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div id="err" class="sub" style="color:var(--bad);min-height:18px;margin-top:6px"></div>
    <button class="btn" id="go">Verify</button><button class="btn ghost" id="again" style="margin-top:8px">Send new code</button>`;
  else if (st === "kyc_pending" || st === "rejected") {
    addr = BXSign.addressOf(ensureKey());
    body = `<h3>Identity check and signing key</h3><p class="sub">Step 3 of 4. Simulated: only a format check is done.</p>
    ${st === "rejected" ? `<div class="note" style="border-color:var(--bad);color:var(--bad)">Not approved: ${esc(u.reject_reason)}. You can submit again.</div>` : ""}
    <label>National ID number (10, 13 or 17 digits)</label><input id="nid" inputmode="numeric" autocomplete="off">
    <label>Photo (optional)</label><input id="ph" type="file" accept="image/*">
    <p class="sub">The ID number is stored only as a one-way hash plus its last 4 digits. The photo is never uploaded: only its fingerprint (hash) is sent.</p>
    <div class="note" id="keynote">Your signing key was created on this device. Its address is ${H(addr)}.<br>The key never leaves this browser. Without it nobody, including the broker and the exchange, can place or cancel an order in your name.</div>
    <div id="err" class="sub" style="color:var(--bad);min-height:18px;margin-top:6px"></div><button class="btn" id="go">Submit for approval</button>`;

/* ───────── trade ───────── */
function expectPrice(t, side) {
  const sn = snap(), v = sn && sn.tickers[t]; if (!v) return null;
  const l = side === "BUY" ? v.asks : v.bids; return l.length ? l[0][0] : null;
}
function riskOf(t, qty, price, otype) {    // the contract's integer rule (BlockExDSE.riskScore), repeated here only as a preview
  const cfg = MK(), tk = cfg.tickers[t], ref = tk.ref, bps = tk.band_bps, mkt = otype === "MARKET";
  const n = qty * (mkt ? ref : price);
  const nPart = Math.min(Math.floor(n * 10000 / cfg.risk_notional), 10000);
  let dPart = 0, dev = 0;
  if (!mkt && bps > 0) { dev = Math.floor(Math.abs(price - ref) * 10000 / ref); dPart = Math.min(Math.floor(dev * 20000 / bps), 10000); }
  const score = Math.floor((nPart + dPart) / 2);
  return { n, dev, score, esc: score >= 5000, out: price * 10000 < ref * (10000 - bps) || price * 10000 > ref * (10000 + bps), big: qty > cfg.max_qty, band: bps / 100 };
}
function quorumText(r) {
  const q = MK().quorum, n = S.info.validators;
  return `<b style="color:${r.esc ? "var(--warn)" : "var(--ok)"}">${r.esc ? `ESCALATED: ${q.risky} of ${n} validators must sign` : `STANDARD: ${q.routine} of ${n} validators must sign`}</b> <span class="sub">(risk score ${Math.round(r.score / 100)} of 100)</span>`;
}
function setDefaultPrice() { const t = $("#tk").value, sn = snap(), v = sn && sn.tickers[t]; $("#px").value = v ? v.last : MK().tickers[t].ref; syncPreview(); }
function syncPreview() {
  if (!$("#prev")) return;
  const cfg = MK(), t = $("#tk").value, q = Math.floor(+$("#qty").value); const p = Math.floor(+$("#px").value);
  if (S.otype === "MARKET") {
    const e = expectPrice(t, S.side), lim = S.side === "BUY" ? cfg.tickers[t].hi : cfg.tickers[t].lo;
    if (!(q > 0)) { $("#prev").textContent = "Enter a quantity."; return; }
    if (q > cfg.max_qty) { $("#prev").innerHTML = `<span style="color:var(--bad)">Above the order size limit of ${fmt(cfg.max_qty)}: the edge validators will refuse it.</span>`; return; }
    if (e == null) { $("#prev").innerHTML = `<span style="color:var(--warn)">No ${S.side === "BUY" ? "sellers" : "buyers"} right now: a market order would be cancelled unfilled.</span>`; return; }
    const r = riskOf(t, q, lim, "MARKET");
    $("#prev").innerHTML = `Best available price <b>${px(S.market, e)}</b>, about ${money(S.market, q * e)} for ${fmt(q)}.<br>${quorumText(r)}<br><span class="sub">You sign a protective limit of ${px(S.market, lim)} (the band edge). It fills what is on the book; the rest is cancelled.</span>`;
    return;
  }
  if (!(q > 0 && p > 0)) { $("#prev").textContent = "Enter a quantity and price."; return; }
  const r = riskOf(t, q, p, "LIMIT");
  $("#prev").innerHTML = `Value <b>${money(S.market, r.n)}</b> · ${(r.dev / 100).toFixed(2)}% from reference<br>` +
    (r.out ? `<span style="color:var(--bad)">Outside the ±${r.band.toFixed(2)}% band for ${esc(t)}: the validators and the contract will both refuse it.</span>` :
     r.big ? `<span style="color:var(--bad)">Above the order size limit of ${fmt(cfg.max_qty)}: the edge validators will refuse it.</span>` : quorumText(r));
}
async function placeOrder() {
  const cfg = MK(), t = $("#tk").value, q = Math.floor(+$("#qty").value);

  const sig = BXSign.sign(S.key, BXSign.orderDigest(domainOf(S.market), order));      // signed here; only the signature leaves the device
  const r = await api("/api/order", { method: "POST", body: { market: S.market, ticker: t, qty: q, price, side: S.side, otype: S.otype, nonce: order.nonce, expiry: order.expiry, sig } });

}

function stageDone(o, s) { return s === "onchain" ? !!o.place_tx : s === "matched" ? !!(o.stages.matched || o.stages.settled) : !!o.stages[s]; }

let busyTick = false;
async function tick() {
  if (busyTick) return; busyTick = true;
  try {
    S.info = S.info || await api("/api/info");
    if (S.token && !S.me) await loadMe();
    const u = S.me && S.me.user; if (!u) { busyTick = false; return; }
    if (S.view === "onboard") {
      const before = u.status; await loadMe();
      if (S.me.user.status !== before) { if (S.me.user.status === "active") { toast("Approved. Your address is registered on-chain."); S.view = null; } route(); }
    } else {
      const v = S.view;
      if (["trade", "market"].includes(v) && !isLive()) { S.snap[S.market] = await api("/api/market/" + S.market); refreshLive(); }
      if (["trade", "orders"].includes(v)) S.orders = await api("/api/orders");
      if (v === "trade") { try { const m = await api("/api/me"); S.portfolios = m.portfolios; } catch (e) {} refreshTrade(); }
      if (v === "orders") refreshOrders();
      if (v === "portfolio") { const m = await api("/api/me"); S.me = m; S.portfolios = m.portfolios || null; refreshPortfolio(); }
      if (v === "market") { [S.nodes, S.info] = await Promise.all([api("/api/nodes"), api("/api/info")]); if (u.role === "admin") S.sim = await api("/api/admin/sim"); refreshMarket(); }
      if (v === "requests") { S.req = await api("/api/admin/requests"); refreshRequests(); }
      if (v === "accounts") { S.accounts = await api("/api/balances?market=" + S.market); refreshAccounts(); }
      if (u.role !== "trader") { const n = S.review.length; S.review = await api("/api/review"); if (S.review.length !== n) renderNav(); if (v === "review") refreshReview(); }
      if (S.lab.benchJob) { const st = await api("/api/admin/bench/" + S.lab.benchJob); S.lab.bench = st; if (st.state !== "running") S.lab.benchJob = null; if (v === "proof") refreshProof(); }
    }
  } catch (e) {}
  busyTick = false;
}

  if (!window.BXSign) { $("#main").innerHTML = `<div class="note">The signing module (vendor/sign.js) did not load, so orders cannot be signed. Check that the file exists and reload.</div>`; return; }
  if ("serviceWorker" in navigator && (location.hostname === "localhost" || location.protocol === "https:")) navigator.serviceWorker.register("/sw.js").catch(() => {});
  try { S.info = await api("/api/info"); if (!S.info.markets[S.market]) S.market = Object.keys(S.info.markets)[0]; if (S.token) await loadMe(); } catch (e) { $("#main").innerHTML = `<div class="note">Cannot reach the gateway on port 9001. Is the system running?</div>`; return; }
  route(); setInterval(tick, 1000);
})();
</script>
